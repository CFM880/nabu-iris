schema = 1

[module]
name        = "nabu-iris"
description = "Iris/Venus video decoder (SM8150 legacy VPU5)"
requires    = []

[provides]
overlay      = "kernel-overlay"
dtsi         = ["arch/arm64/boot/dts/qcom/sm8150-xiaomi-nabu-iris.dtsi"]
config       = ["config/nabu-iris.config"]
systemd      = ["system/qcom-iris-autoload.service", "system/nabu-usb-console.service"]
modules_load = ["system/qcom-iris.conf"]
userspace    = ["scripts/nabu-usb-console.sh"]
firmware     = ["firmware/venus.mbn"]

[build]
kernel_targets = ["drivers/media/platform/qcom/iris/qcom-iris.ko"]

[artifacts]
"qcom-iris.ko" = "out:drivers/media/platform/qcom/iris/qcom-iris.ko"

[install]
"qcom-iris.ko"                      = "/lib/modules/@release@/kernel/drivers/media/platform/qcom/iris/qcom-iris.ko"
"systemd/qcom-iris-autoload.service" = "/etc/systemd/system/qcom-iris-autoload.service"
"systemd/nabu-usb-console.service"   = "/etc/systemd/system/nabu-usb-console.service"
"userspace/nabu-usb-console.sh"      = "/usr/local/lib/nabu/nabu-usb-console.sh"
"modules_load/qcom-iris.conf"        = "/etc/modprobe.d/qcom-iris.conf"
"firmware/venus.mbn"                 = "/lib/firmware/qcom/sm8150/xiaomi/nabu/venus.mbn"
