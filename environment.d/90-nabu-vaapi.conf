# SPDX-License-Identifier: GPL-2.0-only
#
# The Qualcomm Iris VPU driver is the only VA-API implementation on this board
# (Mesa's msm/freedreno VA-API driver cannot drive the VPU, and only
# vpu_drv_video.so is installed).  Without this libva looks for
# msm_drv_video.so, fails, and every application falls back to software decode.
LIBVA_DRIVER_NAME=vpu
# Pin the platform so the driver does not probe other SoCs' variants.
VPU_PLATFORM=qcom-iris
